<?xml version="1.0" encoding="UTF-8"?>
<svg width="22" height="30" viewBox="0 0 22 30" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="mohawkEyeMask">
      <rect x="0" y="0" width="22" height="30" fill="white" />
      <rect x="7" y="10" width="2" height="3" fill="black" />
      <rect x="13" y="10" width="2" height="3" fill="black" />
    </mask>
  </defs>

  <g fill="currentColor" mask="url(#mohawkEyeMask)">
    <!-- Mohawk -->
    <rect x="10" y="0" width="2" height="1" />
    <rect x="9" y="1" width="4" height="1" />
    <rect x="9" y="2" width="4" height="1" />
    <rect x="8" y="3" width="6" height="1" />

    <!-- Head -->
    <rect x="6" y="4" width="10" height="1" />
    <rect x="5" y="5" width="12" height="1" />
    <rect x="4" y="6" width="14" height="1" />
    <rect x="3" y="7" width="16" height="1" />
    <rect x="2" y="8" width="18" height="2" />
    <rect x="1" y="10" width="20" height="4" />

    <!-- Jaw -->
    <rect x="3" y="14" width="16" height="1" />
    <rect x="4" y="15" width="14" height="1" />
    <rect x="5" y="16" width="12" height="1" />
    <rect x="6" y="17" width="10" height="1" />

    <!-- Neck -->
    <rect x="8" y="18" width="6" height="1" />
    <rect x="7" y="19" width="8" height="1" />

    <!-- Shoulders & body -->
    <rect x="4" y="20" width="14" height="1" />
    <rect x="2" y="21" width="18" height="1" />
    <rect x="1" y="22" width="20" height="1" />
    <rect x="0" y="23" width="22" height="7" />
  </g>
</svg>
