<?xml version="1.0" encoding="UTF-8"?>
<svg width="22" height="30" viewBox="0 0 22 30" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="beardedEyeMask">
      <rect x="0" y="0" width="22" height="30" fill="white" />
      <rect x="7" y="10" width="2" height="3" fill="black" />
      <rect x="13" y="10" width="2" height="3" fill="black" />
    </mask>
  </defs>

  <g fill="currentColor" mask="url(#beardedEyeMask)">
    <!-- Head -->
    <rect x="8" y="0" width="6" height="1" />
    <rect x="6" y="1" width="10" height="1" />
    <rect x="5" y="2" width="12" height="1" />
    <rect x="4" y="3" width="14" height="1" />
    <rect x="3" y="4" width="16" height="1" />
    <rect x="2" y="5" width="18" height="5" />
    <rect x="1" y="10" width="20" height="4" />

    <!-- Beard -->
    <rect x="2" y="14" width="18" height="3" />
    <rect x="3" y="17" width="16" height="1" />
    <rect x="4" y="18" width="14" height="1" />
    <rect x="5" y="19" width="12" height="1" />
    <rect x="6" y="20" width="10" height="1" />
    <rect x="8" y="21" width="6" height="1" />

    <!-- Neck -->
    <rect x="8" y="22" width="6" height="1" />
    <rect x="7" y="23" width="8" height="1" />

    <!-- Shoulders & body -->
    <rect x="5" y="24" width="12" height="1" />
